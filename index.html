<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Колесо">
<link rel="manifest" href="manifest.json">
<title>Колесо фортуны</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:720px;margin:auto;padding:20px 16px 36px}
h1{font-size:28px;margin:0 0 6px}.sub{color:#6b7280;margin:0 0 18px}
.controls,.panel{background:#fff;border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 4px 18px #0000000d}
.wheelWrap{position:relative;width:min(94vw,500px);aspect-ratio:1;margin:10px auto}
#wheel{width:100%;height:100%;display:block;transition:transform 5s cubic-bezier(.12,.72,.12,1)}
.pointer{position:absolute;z-index:2;left:50%;top:-2px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:32px solid #ef4444}
.center{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:white;border:5px solid #111827}
.row{display:grid;grid-template-columns:1fr 90px 44px;gap:8px;margin:8px 0}.row input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
button{border:0;border-radius:12px;padding:12px 17px;font-size:16px;font-weight:600;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b;padding:8px}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.result{text-align:center;font-size:20px;font-weight:700;min-height:30px}.sum{text-align:center;color:#6b7280;font-size:14px}.error{text-align:center;color:#dc2626;min-height:22px;font-size:14px}
.settings{display:flex;align-items:center;justify-content:center;gap:8px}.settings input{width:80px;padding:10px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
text{font-weight:700;fill:#fff;paint-order:stroke;stroke:#0005;stroke-width:3px;text-anchor:middle;dominant-baseline:middle}
@media(max-width:420px){main{padding:16px 12px}.row{grid-template-columns:1fr 76px 42px}h1{font-size:25px}}
</style>
</head>
<body>
<main>
<h1>🎡 Колесо фортуны</h1>
<p class="sub">Настрой варианты и их вероятность выпадения.</p>
<div class="controls">
<div class="settings"><label for="duration">Вращение, секунд:</label><input id="duration" type="number" min="1" max="60" step=".5" value="5"></div>
</div>
<div class="wheelWrap"><div class="pointer"></div><svg id="wheel" viewBox="0 0 500 500" aria-label="Колесо"></svg><div class="center"></div></div>
<div id="result" class="result">Готово к вращению</div>
<div id="sum" class="sum"></div>
<div id="error" class="error"></div>
<div class="actions"><button id="spin" class="primary">Крутить</button><button id="add" class="secondary">＋ Добавить вариант</button></div>
<div class="panel"><strong>Варианты</strong><div id="rows"></div></div>
</main>
<script>
const KEY="wheel-pwa-v1";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{items:[["Вариант 1",25],["Вариант 2",25],["Вариант 3",25],["Вариант 4",25]],duration:5};
const svg=document.querySelector("#wheel"),rows=document.querySelector("#rows"),spin=document.querySelector("#spin"),add=document.querySelector("#add"),dur=document.querySelector("#duration"),result=document.querySelector("#result"),sum=document.querySelector("#sum"),error=document.querySelector("#error");
let rotation=0, spinning=false; dur.value=state.duration;
const colors=["#2563eb","#7c3aed","#db2777","#ea580c","#ca8a04","#16a34a","#0891b2","#4f46e5"];
function save(){state.duration=Math.min(60,Math.max(1,Number(dur.value)||5));localStorage.setItem(KEY,JSON.stringify(state))}
function polar(a,r=238){let t=(a-90)*Math.PI/180;return[250+r*Math.cos(t),250+r*Math.sin(t)]}
function valid(){let s=state.items.reduce((a,x)=>a+Number(x[1]||0),0);sum.textContent="Сумма: "+s.toFixed(1)+"%";let ok=Math.abs(s-100)<.05&&state.items.some(x=>Number(x[1])>0);error.textContent=ok?"":"Сумма вероятностей должна быть ровно 100%.";spin.disabled=!ok||spinning;return ok}
function draw(){
 svg.innerHTML="";let total=state.items.reduce((a,x)=>a+Number(x[1]||0),0)||1,angle=0;
 state.items.forEach((it,i)=>{let p=Number(it[1])||0;if(p<=0)return;let sweep=p/total*360,a0=angle,a1=angle+sweep,[x0,y0]=polar(a0),[x1,y1]=polar(a1),large=sweep>180?1:0;
 let path=document.createElementNS("http://www.w3.org/2000/svg","path");path.setAttribute("d",`M250 250 L${x0} ${y0} A238 238 0 ${large} 1 ${x1} ${y1} Z`);path.setAttribute("fill",colors[i%colors.length]);path.setAttribute("stroke","#fff");path.setAttribute("stroke-width","2");svg.append(path);
 if(sweep>8){let [tx,ty]=polar(a0+sweep/2,155),t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x",tx);t.setAttribute("y",ty);t.textContent=(it[0]||"Вариант").slice(0,16);svg.append(t)} angle=a1});
 let c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("cx",250);c.setAttribute("cy",250);c.setAttribute("r",238);c.setAttribute("fill","none");c.setAttribute("stroke","#111827");c.setAttribute("stroke-width","5");svg.append(c);valid()
}
function render(){
 rows.innerHTML="";state.items.forEach((it,i)=>{let r=document.createElement("div");r.className="row";
 let n=document.createElement("input");n.value=it[0];n.placeholder="Название";
 let p=document.createElement("input");p.type="number";p.min=0;p.max=100;p.step=".1";p.value=it[1];
 let d=document.createElement("button");d.className="danger";d.textContent="×";
 n.oninput=()=>{state.items[i][0]=n.value;save();draw()};p.oninput=()=>{state.items[i][1]=Math.max(0,Math.min(100,Number(p.value)||0));save();draw()};d.onclick=()=>{state.items.splice(i,1);save();render();draw()};
 r.append(n,p,d);rows.append(r)})}
dur.oninput=()=>{state.duration=Math.min(60,Math.max(1,Number(dur.value)||5));save()}
add.onclick=()=>{if(state.items.length<30){state.items.push(["Новый вариант",0]);save();render();draw()}}
spin.onclick=()=>{
 if(!valid()||spinning)return;spinning=true;spin.disabled=true;result.textContent="Крутим…";
 let total=state.items.reduce((a,x)=>a+Number(x[1]||0),0),r=Math.random()*total,idx=0;
 for(;idx<state.items.length;idx++){r-=Number(state.items[idx][1]||0);if(r<0)break} if(idx>=state.items.length)idx=state.items.length-1;
 let start=0;for(let j=0;j<idx;j++)start+=Number(state.items[j][1]||0)/total*360;
 let span=Number(state.items[idx][1]||0)/total*360,target=start+span/2,desired=(360-target)%360,current=((rotation%360)+360)%360,delta=(desired-current+360)%360;
 rotation+=(5+Math.floor(Math.random()*3))*360+delta;let d=state.duration;
 svg.style.transition=`transform ${d}s cubic-bezier(.12,.72,.12,1)`;svg.style.transform=`rotate(${rotation}deg)`;
 setTimeout(()=>{result.textContent="Выпало: "+state.items[idx][0];spinning=false;valid()},d*1000+100)
};
render();draw();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
